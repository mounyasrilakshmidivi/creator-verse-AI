<!-- Supabase Auth > Email Templates > Change email address. Subject: Confirm your new CreatorVerse AI email -->
<div style="margin:0;padding:28px 12px;background:#f4f1fb;font-family:Inter,Segoe UI,Arial,sans-serif">
  <div style="max-width:560px;margin:0 auto;background:#fff;border-radius:16px;overflow:hidden;border:1px solid #ebe8f2">
    <div style="background:linear-gradient(90deg,#7137f0,#d82de5);background-color:#8138e8;padding:22px 28px;color:#fff">
      <div style="font-size:20px;font-weight:800">CreatorVerse AI</div>
      <div style="font-size:12px;opacity:.85">Creators × Brands × AI</div>
    </div>
    <div style="padding:28px">
      <h1 style="margin:0 0 14px;font-size:22px;color:#11172a">Confirm your email change</h1>
      <p style="margin:0 0 18px;font-size:15px;line-height:1.6;color:#2a3145">Confirm that you want to change your CreatorVerse AI sign-in email from {{ .Email }} to {{ .NewEmail }}.</p>
      <a href="{{ .SiteURL }}/?token_hash={{ .TokenHash }}&type=email_change" style="display:inline-block;padding:12px 22px;border-radius:999px;background:#8138e8;color:#fff;font-weight:600;text-decoration:none">Confirm email change</a>
      <p style="margin:22px 0 0;font-size:13px;color:#8b93a5">If you didn't request this, ignore this email and consider changing your password.</p>
    </div>
  </div>
</div>
